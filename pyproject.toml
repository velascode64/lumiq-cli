[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lumiq-cli"
version = "0.1.0"
description = "Agent-first CLI and TUI for operating LumiBot strategies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lumibot>=4.5,<5",
    "python-dotenv>=1,<2",
    "rich>=13,<15",
    "textual>=8.2.8",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lumiq = "lumiq.launcher:main"

[tool.setuptools.packages.find]
include = ["lumiq*"]